[project]
name = "markdown-previewer"
version = "0.1.0"
description = "Local developer utilities for Markdown previewing, text diffs, and definitions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cyclopts>=4.9",
  "tkinterdnd2>=0.4.3",
]

[project.scripts]
mdp = "mdp.cli:app"
dct = "dct.cli:app"
df = "df.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdp", "src/dct", "src/df"]

[tool.mypy]
ignore_missing_imports = true
